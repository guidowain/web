<dialog id="feedback-dialog" aria-labelledby="feedback-title"><form id="feedback-form"><div class="dialog-heading"><h2 id="feedback-title">¿Qué no te sirvió?</h2><button id="feedback-close" class="icon-button" type="button" aria-label="Cerrar"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><p id="feedback-news"></p><div class="reasons" role="group" aria-label="Motivos frecuentes"><button type="button" data-reason="Ya lo sabía: no es novedad.">Ya lo sabía</button><button type="button" data-reason="No me interesa este tema.">No me interesa</button><button type="button" data-reason="El título no dice qué pasó.">Título flojo</button><button type="button" data-reason="El resumen es superficial o repite el título.">Resumen flojo</button><button type="button" data-reason="Está repetida en esta u otra edición.">Repetida</button><button type="button" data-reason="Hay un error o la fuente no es confiable.">Error o fuente dudosa</button></div><label for="feedback-comment">Comentario</label><textarea id="feedback-comment" maxlength="1200" rows="3" required placeholder="Elegí un motivo o escribí el tuyo"></textarea><p id="feedback-status" role="status"></p><button id="feedback-save" class="original primary" type="submit">Guardar</button></form></dialog>
