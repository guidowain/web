<dialog id="feedback-dialog" aria-labelledby="feedback-title"><form id="feedback-form"><div class="feedback-heading"><h2 id="feedback-title">Feedback</h2><button id="feedback-close" type="button" aria-label="Cerrar">×</button></div><p id="feedback-news"></p><fieldset><legend>¿Te sirvió esta noticia?</legend><div class="feedback-options"><label><input type="radio" name="valor" value="util" required> Sirvió</label><label><input type="radio" name="valor" value="no_util" required> No sirvió</label></div></fieldset><label for="feedback-comment">Comentario <span>(opcional)</span></label><textarea id="feedback-comment" maxlength="1200" rows="4"></textarea><p id="feedback-status" role="status"></p><button id="feedback-save" class="original" type="submit">Guardar</button></form></dialog>
